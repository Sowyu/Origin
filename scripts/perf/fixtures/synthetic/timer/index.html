<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>timer 0</title>
</head>
<body>
<span id="count">0</span>
<script>
var count = 0;
var span = document.getElementById("count");
setInterval(function () {
  count++;
  span.textContent = count;
  document.title = "timer " + count;
}, 1000);
</script>
</body>
</html>
