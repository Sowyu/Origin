# Cut Zen's window material away under the opaque page, so the window server
# stops blending the blur under every scroll and video frame. Off until the
# harness measures it. See UpdateOpaqueRegion in nsCocoaWindow.mm.
- name: zen.widget.macos.window-material-hole
  value: false
  condition: "defined(XP_MACOSX)"
  cpptype: bool
  mirror: always
  type: static
