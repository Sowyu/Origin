# Origin's tab unloader (src/zen/tabs/OriginTabUnloader.sys.mjs). Once a minute it
# unloads tabs that sat in the background this many minutes. 0 turns it off.
- name: origin.tabs.unload-after-minutes
  value: 0

# Essentials and pinned tabs stay loaded so mail and chat keep their notifications.
- name: origin.tabs.unload-essentials
  value: false

# On the same minute tick, after this many minutes without user input or with another
# app in front, send one memory-pressure notification so WebRender and the content
# processes drop their caches. Skipped while a tab plays media or shares camera,
# microphone or screen. The cost: Back reloads pages instead of restoring them from
# the back-forward cache, and the window redraws once on return. On the user's
# MacBook, about:memory's "Minimize memory usage", which sends this notification
# three times, freed 79 of 1,300 MB with the window in front (2026-10-13). 0 turns
# it off.
- name: origin.memory.trim-after-idle-minutes
  value: 10
