# Origin's startup settings. The startup helpers for these features are removed from
# BrowserComponents.manifest, so the prefs stay locked off.

# IP Protection (Mozilla's VPN proxy). Its startup helper no longer runs.
- name: browser.ipProtection.enabled
  value: false
  locked: true
