# Background work Origin turns off on top of Zen's prefs/privatefox. None of these touches Safe
# Browsing, CRLite, OCSP, Remote Settings or add-on blocklist and update checks
# (docs/research/firefox-prefs-2026-10-13.md, section 3).

# Nimbus rollouts let Mozilla change prefs remotely. Zen already turns studies and Normandy off.
- name: nimbus.rollouts.enabled
  value: false

# Firefox asks detectportal.firefox.com at startup and on every network change whether a Wi-Fi
# login page is in the way. macOS already detects that and shows its own login sheet.
- name: network.captive-portal-service.enabled
  value: false
